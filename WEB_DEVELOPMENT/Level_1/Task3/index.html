<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Matrix Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="calculator-container">
        <div class="calculator-screen">
            <div id="previous-operand" class="previous-input"></div>
            <div id="current-operand" class="current-input">0</div>
        </div>

        <div class="calculator-buttons">
            <button class="btn ctrl-btn" data-action="clear">AC</button>
            <button class="btn ctrl-btn" data-action="delete">DEL</button>
            <button class="btn op-btn" data-operator="%">%</button>
            <button class="btn op-btn" data-operator="/">÷</button>

            <button class="btn num-btn">7</button>
            <button class="btn num-btn">8</button>
            <button class="btn num-btn">9</button>
            <button class="btn op-btn" data-operator="*">×</button>

            <button class="btn num-btn">4</button>
            <button class="btn num-btn">5</button>
            <button class="btn num-btn">6</button>
            <button class="btn op-btn" data-operator="-">−</button>

            <button class="btn num-btn">1</button>
            <button class="btn num-btn">2</button>
            <button class="btn num-btn">3</button>
            <button class="btn op-btn" data-operator="+">+</button>

            <button class="btn num-btn span-two">0</button>
            <button class="btn num-btn">.</button>
            <button class="btn equal-btn" id="equals">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
